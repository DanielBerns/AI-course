[project]
name = "alexnet-pipeline"
version = "0.1.0"
description = "Modernized AlexNet training, dataset curation, and local web inference pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "requests>=2.30.0",
    "opencv-python-headless>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
