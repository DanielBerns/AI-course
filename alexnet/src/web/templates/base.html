<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AlexNet AI Pipeline{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-badge">AlexNet</span>
            <span>Pipeline Studio</span>
        </a>
        <div class="nav-links">
            <a href="/curate" class="nav-item {% if active_page == 'curate' %}active{% endif %}">Dataset Curator</a>
            <a href="/inference" class="nav-item {% if active_page == 'inference' %}active{% endif %}">Inference Server</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
